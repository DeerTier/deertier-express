# .github/workflows/ci.yml
name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still in progress
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # keep in step with the Dockerfile
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Each runs only if app/package.json defines that script
      - run: npm run --if-present lint
      - run: npm run --if-present test

  stack:
    name: Build, migrate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Catches syntax errors in the file the deploy workflow ships to the server
      - name: Validate server compose file
        env:
          COMPOSE_PROJECT_NAME: deertier-ci
          APP_TAG: ci
          DB_HOST_PORT: "3306"
          IS_PREVIEW_SITE: "false"
          DB_PASSWORD: ci
          JWT_SECRET: ci
          ADMIN_KEY: ci
        run: docker compose -f docker-compose.server.yml config --quiet

      - name: Build image and start the stack
        run: docker compose up -d --build

      - name: Smoke test
        run: >
          curl --fail --silent --show-error --output /dev/null
          --retry 10 --retry-delay 3 --retry-all-errors
          http://localhost:3000/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color