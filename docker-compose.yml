# Local stack: the app plus a MySQL database built from db/migrations.
# Defaults are for development; override any ${VAR} in a .env file next to this one.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-deertier}
      DB_USER: ${DB_USER:-deertier}
      DB_PASSWORD: ${DB_PASSWORD:-deertier}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      ADMIN_KEY: ${ADMIN_KEY:-local-dev-admin}
      IS_PREVIEW_SITE: ${IS_PREVIEW_SITE:-true}
    volumes:
      - logs:/srv/logs
      - web-content-backup:/srv/WebContentBackup
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies pending migrations, refreshes db/schema.sql, then exits
  migrate:
    image: ghcr.io/amacneil/dbmate:2.36
    command: ["--wait", "up"]
    environment:
      DATABASE_URL: mysql://${DB_USER:-deertier}:${DB_PASSWORD:-deertier}@db:3306/${DB_DATABASE:-deertier}
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-deertier}
      MYSQL_USER: ${DB_USER:-deertier}
      MYSQL_PASSWORD: ${DB_PASSWORD:-deertier}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # Localhost only, for connecting with a DB client
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP (not the socket) so it stays unhealthy while MySQL initializes
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db-data:
  logs:
  web-content-backup:
